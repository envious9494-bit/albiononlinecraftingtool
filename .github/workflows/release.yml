# Baut das Windows-Programm und haengt es an eine Release.
#
# Ausloesen: einen Tag schieben, der mit "v" beginnt.
#     git tag v1.0.0
#     git push origin v1.0.0
#
# Danach liegen unter "Releases" zwei Dateien:
#     AlbionToolkit-Setup-1.0.1.exe   Installer
#     AlbionToolkit-1.0.1.zip         portable Fassung
#     AlbionToolkit-Setup.exe         dieselbe Datei ohne Versionsnummer
#     AlbionToolkit.zip               dieselbe Datei ohne Versionsnummer
#
# Die beiden Kopien ohne Nummer gibt es, damit die README dauerhaft
# verlinken kann: /releases/latest/download/AlbionToolkit-Setup.exe zeigt
# immer auf die neueste Fassung.
#
# Auf einen Zertifikatsschluessel wird bewusst verzichtet - eine
# Code-Signatur kostet mehrere hundert Euro im Jahr. Die README erklaert
# den Nutzern, wie sie die SmartScreen-Meldung wegklicken.

name: Release bauen

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # laesst sich auch von Hand starten

permissions:
  contents: write           # noetig, um die Release anzulegen

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Installer und ZIP bauen
        # "--publish never" steckt im npm-Skript: sonst versucht
        # electron-builder selbst, eine Release anzulegen, und verlangt
        # dafuer einen Token. Das Hochladen macht der letzte Schritt.
        run: npm run dist
        env:
          # Ohne Zertifikat nicht signieren - sonst bricht der Bau ab.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Kopie ohne Versionsnummer
        # Ein Download-Link, der jede Version ueberlebt.
        run: |
          # Der Uninstaller heisst aehnlich und sortiert sich sogar davor -
          # deshalb ausdruecklich ausschliessen.
          $exe = Get-ChildItem dist -Filter 'AlbionToolkit-Setup-*.exe' |
                 Where-Object { $_.Name -notlike '*__uninstaller*' } | Select-Object -First 1
          $zip = Get-ChildItem dist -Filter 'AlbionToolkit-*.zip'       | Select-Object -First 1
          if (-not $exe) { throw 'Installer nicht gefunden' }
          if (-not $zip) { throw 'ZIP nicht gefunden' }
          Copy-Item $exe.FullName 'dist/AlbionToolkit-Setup.exe'
          Copy-Item $zip.FullName 'dist/AlbionToolkit.zip'
        shell: pwsh

      - name: Ergebnis auflisten
        run: Get-ChildItem dist -File | Select-Object Name, Length
        shell: pwsh

      # Auch ohne Tag greifbar: die Dateien haengen am Lauf selbst.
      - name: Als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: AlbionToolkit-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Release veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
